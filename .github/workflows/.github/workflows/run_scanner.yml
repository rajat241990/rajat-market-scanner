name: GTF Market Scanner

on:
  schedule:
    - cron: '45/15 3-9 * * 1-5'
  workflow_dispatch:

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        # Added the missing math and charting libraries required by the script
        run: |
          pip install yfinance requests pandas numpy matplotlib mplfinance scipy

      - name: Clean and Execute GTF Scanner
        env:
          # Changed to match the exact variable name in the Python code
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }} 
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python -c "with open('gtf_bot.py', 'r', encoding='utf-8') as f: c = f.read().replace('\xa0', ' '); open('gtf_bot.py', 'w', encoding='utf-8').write(c)"
          python gtf_bot.py
