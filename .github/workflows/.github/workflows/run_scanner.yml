name: GTF Market Scanner

on:
  schedule:
    # Runs every 15 mins between 03:45 UTC and 10:00 UTC, Mon-Fri (Indian Market Hours)
    - cron: '45/15 3-9 * * 1-5'
  workflow_dispatch: # Enables manual 1-click test runs

jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          pip install yfinance requests pandas

      - name: Execute GTF Scanner
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python gtf_bot.py
